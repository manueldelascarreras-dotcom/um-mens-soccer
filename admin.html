<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UM Soccer — CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:      #1A3C2A;
      --green-mid:  #22503A;
      --green-light:#2D6B4E;
      --copper:     #C4622D;
      --gold:       #C9A84C;
      --cream:      #F5F0E6;
      --white:      #ffffff;
      --gray-50:    #F9FAFB;
      --gray-100:   #F3F4F6;
      --gray-200:   #E5E7EB;
      --gray-300:   #D1D5DB;
      --gray-500:   #6B7280;
      --gray-700:   #374151;
      --gray-900:   #111827;
      --red:        #DC2626;
      --sidebar-w:  240px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--gray-100); color: var(--gray-900); display: flex; height: 100vh; overflow: hidden; }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--green);
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
    }
    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .sidebar-logo img { width: 36px; height: 36px; border-radius: 50%; background: white; object-fit: contain; }
    .sidebar-logo-text { font-size: .8rem; font-weight: 700; color: var(--cream); line-height: 1.3; }
    .sidebar-logo-text span { display: block; font-size: .65rem; font-weight: 400; color: rgba(245,240,230,.5); margin-top: 1px; }

    .sidebar-nav { flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 8px; border: none;
      background: none; color: rgba(245,240,230,.65);
      font-family: inherit; font-size: .825rem; font-weight: 500;
      cursor: pointer; text-align: left; transition: background .15s, color .15s;
      width: 100%;
    }
    .nav-btn:hover { background: rgba(255,255,255,.08); color: var(--cream); }
    .nav-btn.active { background: rgba(255,255,255,.14); color: var(--cream); }
    .nav-btn svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
    .nav-btn.active svg { opacity: 1; }

    .sidebar-footer { padding: 16px 12px; border-top: 1px solid rgba(255,255,255,.1); }
    .view-site {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 12px; border-radius: 8px;
      color: rgba(245,240,230,.5); font-size: .78rem; font-weight: 500;
      text-decoration: none; transition: color .15s, background .15s;
    }
    .view-site:hover { color: var(--gold); background: rgba(255,255,255,.06); }
    .view-site svg { width: 13px; height: 13px; }

    /* ── Main ── */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .topbar {
      background: var(--white); border-bottom: 1px solid var(--gray-200);
      padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .topbar-title { font-size: 1rem; font-weight: 600; color: var(--gray-900); }
    .topbar-title span { color: var(--gray-500); font-weight: 400; font-size: .875rem; margin-left: 8px; }

    .save-bar {
      display: flex; align-items: center; gap: 12px;
    }
    .status-msg { font-size: .78rem; font-weight: 500; opacity: 0; transition: opacity .3s; }
    .status-msg.visible { opacity: 1; }
    .status-msg.ok  { color: #16A34A; }
    .status-msg.err { color: var(--red); }

    .btn-save {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 20px; background: var(--green); color: white;
      border: none; border-radius: 6px; font-family: inherit; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-save:hover { background: var(--green-mid); }
    .btn-save svg { width: 14px; height: 14px; }

    /* ── Panels ── */
    .panels { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .panel { display: none; }
    .panel.active { display: block; }

    .panel-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .panel-header h2 { font-size: 1.1rem; font-weight: 600; }

    .btn-add {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; background: var(--copper); color: white;
      border: none; border-radius: 6px; font-family: inherit; font-size: .8rem; font-weight: 600;
      cursor: pointer; transition: background .15s;
    }
    .btn-add:hover { background: #D4784A; }
    .btn-add svg { width: 14px; height: 14px; }

    /* ── Cards / list ── */
    .item-list { display: flex; flex-direction: column; gap: 10px; }

    .item-card {
      background: var(--white); border: 1px solid var(--gray-200);
      border-radius: 10px; padding: 14px 16px;
      display: grid; align-items: center; gap: 10px;
    }
    .item-card.player-card  { grid-template-columns: 40px 1fr 1fr auto; }
    .item-card.game-card    { grid-template-columns: 40px 1fr 90px 1fr 130px auto; }
    .item-card.alumni-card  { grid-template-columns: 40px 1fr 1fr 1fr auto; }

    .item-num {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--gray-100); display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: var(--gray-500);
    }

    .field-input {
      padding: 7px 10px; border: 1px solid var(--gray-200); border-radius: 6px;
      font-family: inherit; font-size: .825rem; color: var(--gray-900);
      background: var(--gray-50); transition: border-color .15s, background .15s;
      width: 100%;
    }
    .field-input:focus { outline: none; border-color: var(--green-light); background: white; }

    select.field-input { cursor: pointer; }

    .logo-preview {
      width: 36px; height: 36px; object-fit: contain;
      border-radius: 4px;
    }

    .location-toggle {
      display: flex; border: 1px solid var(--gray-200); border-radius: 6px; overflow: hidden;
    }
    .location-toggle button {
      flex: 1; padding: 7px 8px; border: none; background: var(--gray-50);
      font-family: inherit; font-size: .75rem; font-weight: 600; cursor: pointer;
      transition: background .15s, color .15s; color: var(--gray-500);
    }
    .location-toggle button.active-home { background: #D1FAE5; color: #065F46; }
    .location-toggle button.active-away { background: #FEE2E2; color: #991B1B; }

    .btn-del {
      width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--gray-200);
      background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--gray-400); transition: background .15s, color .15s, border-color .15s;
      flex-shrink: 0;
    }
    .btn-del:hover { background: #FEE2E2; border-color: #FECACA; color: var(--red); }
    .btn-del svg { width: 14px; height: 14px; }

    /* Column labels */
    .list-header {
      display: grid; align-items: center; gap: 10px;
      padding: 0 16px; margin-bottom: 6px;
    }
    .list-header.player-header  { grid-template-columns: 40px 1fr 1fr auto; }
    .list-header.game-header    { grid-template-columns: 40px 1fr 90px 1fr 130px auto; }
    .list-header.alumni-header  { grid-template-columns: 40px 1fr 1fr 1fr auto; }
    .col-label { font-size: .7rem; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .06em; }

    /* empty state */
    .empty-state {
      text-align: center; padding: 48px 24px;
      color: var(--gray-500); font-size: .875rem;
      background: var(--white); border: 1.5px dashed var(--gray-200); border-radius: 10px;
    }
    .empty-state svg { width: 36px; height: 36px; margin: 0 auto 12px; display: block; color: var(--gray-300); }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="logo.png" alt="UM Soccer" />
      <div class="sidebar-logo-text">
        UM Men's Soccer
        <span>Content Manager</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn active" onclick="switchTab('players')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Players
      </button>
      <button class="nav-btn" onclick="switchTab('games')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Games
      </button>
      <button class="nav-btn" onclick="switchTab('alumni')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
        Alumni
      </button>
    </nav>
    <div class="sidebar-footer">
      <a href="index.html" class="view-site" target="_blank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        View Site
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">Players <span id="topbar-count"></span></div>
      <div class="save-bar">
        <span class="status-msg" id="status-msg"></span>
        <button class="btn-save" onclick="saveAll()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save Changes
        </button>
      </div>
    </div>

    <div class="panels">

      <!-- PLAYERS -->
      <div class="panel active" id="panel-players">
        <div class="panel-header">
          <h2>Roster</h2>
          <button class="btn-add" onclick="addPlayer()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Player
          </button>
        </div>
        <div class="list-header player-header">
          <div></div>
          <div class="col-label">Name</div>
          <div class="col-label">Position / Role</div>
          <div></div>
        </div>
        <div class="item-list" id="players-list"></div>
      </div>

      <!-- GAMES -->
      <div class="panel" id="panel-games">
        <div class="panel-header">
          <h2>Schedule</h2>
          <button class="btn-add" onclick="addGame()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Game
          </button>
        </div>
        <div class="list-header game-header">
          <div></div>
          <div class="col-label">Date</div>
          <div class="col-label">Time</div>
          <div class="col-label">Opponent</div>
          <div class="col-label">Logo File</div>
          <div></div>
        </div>
        <div class="item-list" id="games-list"></div>
      </div>

      <!-- ALUMNI -->
      <div class="panel" id="panel-alumni">
        <div class="panel-header">
          <h2>Alumni</h2>
          <button class="btn-add" onclick="addAlumni()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add Alumni
          </button>
        </div>
        <div class="list-header alumni-header">
          <div></div>
          <div class="col-label">Name</div>
          <div class="col-label">Class Year</div>
          <div class="col-label">Position (optional)</div>
          <div></div>
        </div>
        <div class="item-list" id="alumni-list"></div>
      </div>

    </div>
  </div>

  <script>
    let currentTab = 'players';
    let data = { players: [], games: [], alumni: [] };

    const LOGOS = ['FAU.png','FIU.png','FGCU.png','UCF.png','NSU.png'];

    // ── Tab switching ──────────────────────────────
    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      event.currentTarget.classList.add('active');
      document.getElementById(`panel-${tab}`).classList.add('active');
      const titles = { players: 'Players', games: 'Games', alumni: 'Alumni' };
      document.getElementById('topbar-title').childNodes[0].textContent = titles[tab] + ' ';
      updateCount();
    }

    function updateCount() {
      const n = data[currentTab].length;
      document.getElementById('topbar-count').textContent = `${n} ${n === 1 ? 'entry' : 'entries'}`;
    }

    // ── Render ────────────────────────────────────
    function initials(name) {
      const parts = name.trim().split(/\s+/);
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function renderPlayers() {
      const list = document.getElementById('players-list');
      if (!data.players.length) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>No players yet. Click Add Player.</div>`;
        return;
      }
      list.innerHTML = data.players.map((p, i) => `
        <div class="item-card player-card">
          <div class="item-num">${i + 1}</div>
          <input class="field-input" value="${esc(p.name)}" placeholder="Full name"
            oninput="data.players[${i}].name = this.value" />
          <input class="field-input" value="${esc(p.position)}" placeholder="Player / Position"
            oninput="data.players[${i}].position = this.value" />
          <button class="btn-del" onclick="removeItem('players', ${i})" title="Remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      `).join('');
      updateCount();
    }

    function renderGames() {
      const list = document.getElementById('games-list');
      if (!data.games.length) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>No games yet. Click Add Game.</div>`;
        return;
      }
      list.innerHTML = data.games.map((g, i) => `
        <div class="item-card game-card">
          <div class="item-num">${i + 1}</div>
          <input class="field-input" value="${esc(g.date)}" placeholder="e.g. Friday, Sept 19"
            oninput="data.games[${i}].date = this.value" />
          <input class="field-input" value="${esc(g.time)}" placeholder="12:00 PM"
            oninput="data.games[${i}].time = this.value" />
          <input class="field-input" value="${esc(g.opponent)}" placeholder="Opponent name"
            oninput="data.games[${i}].opponent = this.value" />
          <div style="display:flex;align-items:center;gap:8px;">
            <img class="logo-preview" id="logo-prev-${i}" src="${esc(g.logo)}" onerror="this.style.opacity='.2'" />
            <select class="field-input" onchange="data.games[${i}].logo = this.value; document.getElementById('logo-prev-${i}').src=this.value; document.getElementById('logo-prev-${i}').style.opacity=1;">
              ${LOGOS.map(l => `<option value="${l}" ${g.logo===l?'selected':''}>${l}</option>`).join('')}
              <option value="custom" ${!LOGOS.includes(g.logo)?'selected':''}>Other…</option>
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <div class="location-toggle">
              <button onclick="setLocation(${i},'home')" class="${g.location==='home'?'active-home':''}">Home</button>
              <button onclick="setLocation(${i},'away')" class="${g.location==='away'?'active-away':''}">Away</button>
            </div>
            <button class="btn-del" onclick="removeItem('games', ${i})" title="Remove">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
            </button>
          </div>
        </div>
      `).join('');
      updateCount();
    }

    function renderAlumni() {
      const list = document.getElementById('alumni-list');
      if (!data.alumni.length) {
        list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>No alumni yet. Click Add Alumni.</div>`;
        return;
      }
      list.innerHTML = data.alumni.map((a, i) => `
        <div class="item-card alumni-card">
          <div class="item-num">${i + 1}</div>
          <input class="field-input" value="${esc(a.name)}" placeholder="Full name"
            oninput="data.alumni[${i}].name = this.value" />
          <input class="field-input" value="${esc(a.year)}" placeholder="e.g. 2023"
            oninput="data.alumni[${i}].year = this.value" />
          <input class="field-input" value="${esc(a.position||'')}" placeholder="Position (optional)"
            oninput="data.alumni[${i}].position = this.value" />
          <button class="btn-del" onclick="removeItem('alumni', ${i})" title="Remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      `).join('');
      updateCount();
    }

    // ── Add / remove items ─────────────────────────
    function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

    function addPlayer() {
      data.players.push({ id: uid(), name: '', position: 'Player' });
      renderPlayers();
      const inputs = document.querySelectorAll('#players-list .field-input');
      inputs[inputs.length - 2].focus();
    }

    function addGame() {
      data.games.push({ id: uid(), date: '', time: '', location: 'away', opponent: '', logo: 'FAU.png' });
      renderGames();
      const inputs = document.querySelectorAll('#games-list .field-input');
      inputs[inputs.length - 5]?.focus();
    }

    function addAlumni() {
      data.alumni.push({ id: uid(), name: '', year: '', position: '' });
      renderAlumni();
      const inputs = document.querySelectorAll('#alumni-list .field-input');
      inputs[inputs.length - 3]?.focus();
    }

    function removeItem(type, idx) {
      data[type].splice(idx, 1);
      if (type === 'players') renderPlayers();
      if (type === 'games')   renderGames();
      if (type === 'alumni')  renderAlumni();
    }

    function setLocation(idx, loc) {
      data.games[idx].location = loc;
      renderGames();
    }

    // ── Save ──────────────────────────────────────
    async function saveAll() {
      const msg = document.getElementById('status-msg');
      try {
        await Promise.all(
          ['players', 'games', 'alumni'].map(r =>
            fetch(`/api/${r}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data[r]) })
          )
        );
        msg.textContent = '✓ Saved successfully';
        msg.className = 'status-msg ok visible';
      } catch {
        msg.textContent = '✗ Save failed';
        msg.className = 'status-msg err visible';
      }
      setTimeout(() => msg.classList.remove('visible'), 3000);
    }

    // ── Helpers ───────────────────────────────────
    function esc(s) { return String(s || '').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

    // ── Load on start ─────────────────────────────
    async function load() {
      const [players, games, alumni] = await Promise.all([
        fetch('/api/players').then(r => r.json()),
        fetch('/api/games').then(r => r.json()),
        fetch('/api/alumni').then(r => r.json()),
      ]);
      data = { players, games, alumni };
      renderPlayers();
      renderGames();
      renderAlumni();
      updateCount();
    }

    load();
  </script>
</body>
</html>
